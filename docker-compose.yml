services:
  postgres:
    # 17 or later: transaction_timeout was added in Postgres 17.
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created; `just db-reset` recreates it.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP: during init the server listens only on its Unix socket,
      # so this stays unhealthy until the init script has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
